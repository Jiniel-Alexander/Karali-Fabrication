<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Technical schematic illustration for Structural Steel Mezzanine Floor Grid &amp; Decking">
  <defs>
    <linearGradient id="cat5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="cat5-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cat5-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cat5-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="cat5-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cat5-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#cat5-bg)"/>
  <rect width="640" height="400" fill="url(#cat5-grid)"/>
  <rect width="640" height="400" fill="url(#cat5-glow)"/>

  <rect x="20" y="18" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.82" stroke="#335599" stroke-width="1"/>
  <circle cx="38" cy="34" r="4.5" fill="#f5a623"/>
  <text x="52" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.2">SCHEMATIC ILLUSTRATION · SHEDS &amp; MEZZANINES</text>
  <text x="606" y="38" fill="#f5a623" font-family="monospace" font-size="11" text-anchor="end">KF-CAT-05</text>

  
      <g>
        <!-- Mezzanine Deck & Primary Girder -->
        <rect x="75" y="175" width="490" height="28" fill="url(#cat5-orange)" stroke="#0f1f4a" stroke-width="2"/>
        <rect x="75" y="203" width="490" height="20" fill="url(#cat5-steel-dark)"/>
        <!-- Columns -->
        <rect x="95" y="223" width="26" height="118" fill="url(#cat5-steel)"/>
        <rect x="307" y="223" width="26" height="118" fill="url(#cat5-steel)"/>
        <rect x="519" y="223" width="26" height="118" fill="url(#cat5-steel)"/>
        <!-- Top Perimeter Handrail -->
        <rect x="85" y="118" width="470" height="57" fill="none" stroke="#cbd5e1" stroke-width="3.5"/>
        <line x1="85" y1="146" x2="555" y2="146" stroke="#f5a623" stroke-width="2.5"/>
        <line x1="200" y1="118" x2="200" y2="175" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="320" y1="118" x2="320" y2="175" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="440" y1="118" x2="440" y2="175" stroke="#cbd5e1" stroke-width="3"/>
      </g>

  <line x1="30" y1="342" x2="610" y2="342" stroke="#f5a623" stroke-width="2"/>
  <rect x="20" y="350" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.84"/>
  <text x="34" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" font-weight="bold">Structural Steel Mezzanine Floor Grid &amp; Decking</text>
  <text x="606" y="370" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">BUILD TO DRAWING</text>
</svg>