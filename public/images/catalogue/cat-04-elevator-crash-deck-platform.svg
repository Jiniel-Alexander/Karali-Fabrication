  <rect x="20" y="18" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.82" stroke="#335599" stroke-width="1"/>
  <circle cx="38" cy="34" r="4.5" fill="#f5a623"/>
  <text x="52" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.2">SCHEMATIC ILLUSTRATION · LIFT SHAFTS &amp; DECKS</text>
  <text x="606" y="38" fill="#f5a623" font-family="monospace" font-size="11" text-anchor="end">KF-CAT-04</text>

  
      <g>
