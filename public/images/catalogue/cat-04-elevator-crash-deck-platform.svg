<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Technical schematic illustration for Heavy-Duty Elevator Shaft Crash Deck &amp; Working Platform">
  <defs>
    <linearGradient id="cat4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
