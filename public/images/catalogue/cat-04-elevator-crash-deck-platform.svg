    <radialGradient id="cat4-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cat4-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#cat4-bg)"/>
