  <rect x="20" y="350" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.84"/>
  <text x="34" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" font-weight="bold">Heavy-Duty Elevator Shaft Crash Deck &amp; Working Platform</text>
  <text x="606" y="370" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">BUILD TO DRAWING</text>
