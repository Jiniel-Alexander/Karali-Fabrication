<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Technical schematic illustration for Heavy Steel Workshop Workbenches &amp; Assembly Tables">
  <defs>
    <linearGradient id="cat14-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="cat14-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cat14-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cat14-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="cat14-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cat14-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#cat14-bg)"/>
  <rect width="640" height="400" fill="url(#cat14-grid)"/>
  <rect width="640" height="400" fill="url(#cat14-glow)"/>

  <rect x="20" y="18" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.82" stroke="#335599" stroke-width="1"/>
  <circle cx="38" cy="34" r="4.5" fill="#f5a623"/>
  <text x="52" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.2">SCHEMATIC ILLUSTRATION · INDUSTRIAL RACKING</text>
  <text x="606" y="38" fill="#f5a623" font-family="monospace" font-size="11" text-anchor="end">KF-CAT-14</text>

  
      <g>
        <rect x="90" y="140" width="460" height="28" rx="2" fill="url(#cat14-orange)" stroke="#0f1f4a" stroke-width="2"/>
        <rect x="110" y="168" width="24" height="150" fill="url(#cat14-steel)"/>
        <rect x="506" y="168" width="24" height="150" fill="url(#cat14-steel)"/>
        <rect x="110" y="260" width="420" height="16" fill="url(#cat14-steel-dark)"/>
        <rect x="130" y="200" width="110" height="50" rx="3" fill="#0b1a3d" stroke="#f5a623" stroke-width="1.5"/>
      </g>

  <line x1="30" y1="342" x2="610" y2="342" stroke="#f5a623" stroke-width="2"/>
  <rect x="20" y="350" width="600" height="32" rx="5" fill="#071128" fill-opacity="0.84"/>
  <text x="34" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" font-weight="bold">Heavy Steel Workshop Workbenches &amp; Assembly Tables</text>
  <text x="606" y="370" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">BUILD TO DRAWING</text>
