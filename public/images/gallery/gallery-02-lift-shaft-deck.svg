<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Elevator Shaft Steel Cage, Divider Beams &amp; Crash Deck Slot">
  <defs>
    <linearGradient id="gal2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="gal2-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gal2-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gal2-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="gal2-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gal2-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#gal2-bg)"/>
  <rect width="800" height="500" fill="url(#gal2-grid)"/>
  <rect width="800" height="500" fill="url(#gal2-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">ILLUSTRATIVE PLACEHOLDER · AWAITING VERIFIED SITE PHOTO</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-REF-02 // PLACEHOLDER SLOT</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Outer Concrete/Core Shaft Walls -->
        <rect x="195" y="82" width="18" height="344" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <rect x="587" y="82" width="18" height="344" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <!-- Self-Supporting Steel Shaft Columns -->
        <rect x="235" y="88" width="26" height="338" fill="url(#gal2-steel)"/>
        <rect x="539" y="88" width="26" height="338" fill="url(#gal2-steel)"/>
        <rect x="388" y="88" width="24" height="338" fill="url(#gal2-steel-dark)" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Intermediate Divider Beams -->
        <rect x="235" y="145" width="330" height="20" fill="url(#gal2-steel-dark)" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="235" y="295" width="330" height="20" fill="url(#gal2-steel-dark)" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Diagonal Shaft Bracing -->
        <line x1="261" y1="165" x2="388" y2="295" stroke="#64748b" stroke-width="4"/>
        <line x1="388" y1="165" x2="261" y2="295" stroke="#64748b" stroke-width="4"/>
        <line x1="412" y1="165" x2="539" y2="295" stroke="#64748b" stroke-width="4"/>
        <line x1="539" y1="165" x2="412" y2="295" stroke="#64748b" stroke-width="4"/>
        <!-- Highlighted Heavy-Duty Crash Deck Platform -->
        <rect x="215" y="218" width="370" height="26" rx="3" fill="url(#gal2-orange)" stroke="#0f1f4a" stroke-width="2"/>
        <line x1="230" y1="231" x2="570" y2="231" stroke="#0f1f4a" stroke-width="2" stroke-dasharray="12 8"/>
        <!-- Guide Rail Brackets -->
        <rect x="213" y="140" width="22" height="12" fill="#f5a623"/>
        <rect x="565" y="140" width="22" height="12" fill="#f5a623"/>
        <rect x="213" y="290" width="22" height="12" fill="#f5a623"/>
        <rect x="565" y="290" width="22" height="12" fill="#f5a623"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Elevator Shaft Steel Cage, Divider Beams &amp; Crash Deck Slot</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>