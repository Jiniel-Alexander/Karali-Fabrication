<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Structural Steel Beam, Column &amp; Roof Truss Erection Slot">
  <defs>
    <linearGradient id="gal1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="gal1-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gal1-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gal1-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="gal1-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gal1-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#gal1-bg)"/>
  <rect width="800" height="500" fill="url(#gal1-grid)"/>
  <rect width="800" height="500" fill="url(#gal1-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">ILLUSTRATIVE PLACEHOLDER · AWAITING VERIFIED SITE PHOTO</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-REF-01 // PLACEHOLDER SLOT</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Left & Right H-Columns -->
        <rect x="115" y="105" width="44" height="320" fill="url(#gal1-steel-dark)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="129" y="105" width="16" height="320" fill="url(#gal1-steel)"/>
        <rect x="641" y="105" width="44" height="320" fill="url(#gal1-steel-dark)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="655" y="105" width="16" height="320" fill="url(#gal1-steel)"/>
        <!-- Center Column -->
        <rect x="380" y="165" width="40" height="260" fill="url(#gal1-steel-dark)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="392" y="165" width="16" height="260" fill="url(#gal1-steel)"/>
        <!-- Main Horizontal I-Beam -->
        <rect x="105" y="235" width="590" height="36" fill="url(#gal1-steel-dark)" stroke="#cbd5e1" stroke-width="2"/>
        <rect x="105" y="245" width="590" height="16" fill="url(#gal1-steel)"/>
        <!-- Pitched Roof Truss -->
        <polygon points="105,165 400,88 695,165" fill="none" stroke="url(#gal1-steel)" stroke-width="12" stroke-linejoin="round"/>
        <line x1="105" y1="165" x2="695" y2="165" stroke="url(#gal1-steel)" stroke-width="10"/>
        <path d="M180,165 L250,128 L325,165 L400,88 L475,165 L550,128 L620,165" fill="none" stroke="url(#gal1-orange)" stroke-width="5" stroke-linejoin="round"/>
        <!-- Gusset Plates & Base Plates -->
        <polygon points="159,235 215,235 159,290" fill="#f5a623"/>
        <polygon points="641,235 585,235 641,290" fill="#f5a623"/>
        <polygon points="380,271 340,271 380,310" fill="#f5a623"/>
        <polygon points="420,271 460,271 420,310" fill="#f5a623"/>
        <rect x="98" y="412" width="78" height="14" fill="#f5a623"/>
        <rect x="361" y="412" width="78" height="14" fill="#f5a623"/>
        <rect x="624" y="412" width="78" height="14" fill="#f5a623"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Structural Steel Beam, Column &amp; Roof Truss Erection Slot</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>