<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Corrugated Galvalume Profile Sheets, Polycarbonate Skylights &amp;amp; Gutter Systems">
  <defs>
    <linearGradient id="svc6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc6-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc6-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc6-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc6-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc6-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc6-bg)"/>
  <rect width="800" height="500" fill="url(#svc6-grid)"/>
  <rect width="800" height="500" fill="url(#svc6-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">06 / INDUSTRIAL ROOFING &amp;amp; CLADDING</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-06 // ROOFING &amp;amp; CLADDING</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Sloped Rafter & Purlin Grid -->
        <polygon points="100,160 700,90 700,120 100,190" fill="url(#svc6-steel)"/>
        <line x1="150" y1="180" x2="150" y2="380" stroke="url(#svc6-steel-dark)" stroke-width="14"/>
        <line x1="650" y1="120" x2="650" y2="380" stroke="url(#svc6-steel-dark)" stroke-width="14"/>
        <!-- Corrugated Roofing Sheet Profiles -->
        <g stroke="url(#svc6-orange)" stroke-width="8" stroke-linecap="round">
          <line x1="90" y1="210" x2="690" y2="140"/>
          <line x1="90" y1="235" x2="690" y2="165"/>
          <line x1="90" y1="260" x2="690" y2="190"/>
        </g>
        <!-- Corrugation Rib Highlights -->
        <g stroke="#cbd5e1" stroke-width="3">
          <line x1="160" y1="202" x2="160" y2="280"/>
          <line x1="240" y1="192" x2="240" y2="270"/>
          <line x1="320" y1="182" x2="320" y2="260"/>
          <line x1="400" y1="172" x2="400" y2="250"/>
          <line x1="480" y1="162" x2="480" y2="240"/>
          <line x1="560" y1="152" x2="560" y2="230"/>
          <line x1="640" y1="142" x2="640" y2="220"/>
        </g>
        <!-- Clear Polycarbonate Skylight Panel -->
        <polygon points="260,190 420,172 420,250 260,268" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2"/>
        <!-- Eave Gutter & Downpipe -->
        <rect x="80" y="270" width="30" height="24" rx="3" fill="#f5a623"/>
        <line x1="95" y1="294" x2="95" y2="415" stroke="url(#svc6-steel)" stroke-width="8"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Corrugated Galvalume Profile Sheets, Polycarbonate Skylights &amp;amp; Gutter Systems</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>