<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Steel Staircase Stringers, Tubular Safety Handrails &amp; Sliding Gate">
  <defs>
    <linearGradient id="svc4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc4-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc4-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc4-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc4-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc4-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc4-bg)"/>
  <rect width="800" height="500" fill="url(#svc4-grid)"/>
  <rect width="800" height="500" fill="url(#svc4-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">04 / ACCESS &amp; PERIMETER METALWORK</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-04 // STAIRS, RAILINGS &amp; GATES</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Steel Staircase Stringer & Chequered Treads (Left Side) -->
        <polygon points="85,425 355,175 385,175 115,425" fill="url(#svc4-steel)"/>
        <rect x="355" y="175" width="95" height="18" fill="url(#svc4-steel)"/>
        <rect x="425" y="193" width="18" height="232" fill="url(#svc4-steel-dark)" stroke="#94a3b8" stroke-width="1.5"/>
        <!-- Stair Treads -->
        <g fill="#f5a623">
          <rect x="120" y="380" width="46" height="8"/>
          <rect x="160" y="343" width="46" height="8"/>
          <rect x="200" y="306" width="46" height="8"/>
          <rect x="240" y="269" width="46" height="8"/>
          <rect x="280" y="232" width="46" height="8"/>
          <rect x="320" y="195" width="46" height="8"/>
        </g>
        <!-- Inclined Tubular Handrail -->
        <line x1="85" y1="345" x2="355" y2="95" stroke="url(#svc4-orange)" stroke-width="6" stroke-linecap="round"/>
        <line x1="85" y1="375" x2="355" y2="125" stroke="#f5a623" stroke-width="3"/>
        <line x1="355" y1="95" x2="448" y2="95" stroke="url(#svc4-orange)" stroke-width="6" stroke-linecap="round"/>
        <line x1="140" y1="380" x2="140" y2="295" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="220" y1="306" x2="220" y2="220" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="300" y1="232" x2="300" y2="146" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="355" y1="175" x2="355" y2="95" stroke="#cbd5e1" stroke-width="3.5"/>
        <line x1="440" y1="175" x2="440" y2="95" stroke="#cbd5e1" stroke-width="3.5"/>

        <!-- Heavy-Duty Compound Gate (Right Side) -->
        <rect x="485" y="210" width="230" height="205" fill="#0f214e" stroke="url(#svc4-steel)" stroke-width="8"/>
        <line x1="485" y1="285" x2="715" y2="285" stroke="#f5a623" stroke-width="5"/>
        <line x1="485" y1="355" x2="715" y2="355" stroke="#94a3b8" stroke-width="4"/>
        <!-- Gate Vertical Bars -->
        <g stroke="#cbd5e1" stroke-width="3">
          <line x1="515" y1="210" x2="515" y2="415"/>
          <line x1="545" y1="210" x2="545" y2="415"/>
          <line x1="575" y1="210" x2="575" y2="415"/>
          <line x1="605" y1="210" x2="605" y2="415"/>
          <line x1="635" y1="210" x2="635" y2="415"/>
          <line x1="665" y1="210" x2="665" y2="415"/>
          <line x1="695" y1="210" x2="695" y2="415"/>
        </g>
        <!-- Sliding Gate Track Wheels -->
        <circle cx="520" cy="418" r="8" fill="#f5a623"/>
        <circle cx="680" cy="418" r="8" fill="#f5a623"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Steel Staircase Stringers, Tubular Safety Handrails &amp; Sliding Gate</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>