<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Factory Shed Portal Trusses, Purlins &amp; Structural Mezzanine Floor Grid">
  <defs>
    <linearGradient id="svc3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc3-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc3-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc3-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc3-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc3-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc3-bg)"/>
  <rect width="800" height="500" fill="url(#svc3-grid)"/>
  <rect width="800" height="500" fill="url(#svc3-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">03 / INDUSTRIAL ENCLOSURES &amp; FLOORS</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-03 // SHEDS &amp; MEZZANINES</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Portal Shed Columns & Rafters -->
        <path d="M95,425 L95,175 L400,85 L705,175 L705,425" fill="none" stroke="url(#svc3-steel)" stroke-width="18" stroke-linejoin="round"/>
        <path d="M155,425 L155,205 L400,128 L645,205 L645,425" fill="none" stroke="#475569" stroke-width="8" stroke-linejoin="round"/>
        <!-- Roof Truss Webbing -->
        <path d="M110,175 L205,145 L295,175 L400,92 L505,175 L595,145 L690,175" fill="none" stroke="#94a3b8" stroke-width="4"/>
        <!-- Elevated Structural Mezzanine Floor Deck -->
        <rect x="95" y="275" width="610" height="28" fill="url(#svc3-orange)" stroke="#0f1f4a" stroke-width="2"/>
        <!-- Mezzanine Support Columns -->
        <rect x="285" y="303" width="24" height="122" fill="url(#svc3-steel)"/>
        <rect x="490" y="303" width="24" height="122" fill="url(#svc3-steel)"/>
        <!-- Mezzanine Safety Handrail -->
        <rect x="115" y="232" width="570" height="43" fill="none" stroke="#f5a623" stroke-width="3"/>
        <line x1="115" y1="253" x2="685" y2="253" stroke="#f5a623" stroke-width="2"/>
        <line x1="210" y1="232" x2="210" y2="275" stroke="#f5a623" stroke-width="2.5"/>
        <line x1="305" y1="232" x2="305" y2="275" stroke="#f5a623" stroke-width="2.5"/>
        <line x1="400" y1="232" x2="400" y2="275" stroke="#f5a623" stroke-width="2.5"/>
        <line x1="495" y1="232" x2="495" y2="275" stroke="#f5a623" stroke-width="2.5"/>
        <line x1="590" y1="232" x2="590" y2="275" stroke="#f5a623" stroke-width="2.5"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Factory Shed Portal Trusses, Purlins &amp; Structural Mezzanine Floor Grid</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>