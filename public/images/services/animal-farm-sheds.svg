<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ventilated Cattle Dairy Sheds (Tabela), Poultry Coops &amp;amp; Livestock Shelters">
  <defs>
    <linearGradient id="svc12-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc12-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc12-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc12-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc12-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc12-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc12-bg)"/>
  <rect width="800" height="500" fill="url(#svc12-grid)"/>
  <rect width="800" height="500" fill="url(#svc12-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">12 / AGRICULTURAL STEELWORK</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-12 // ANIMAL FARM SHEDS</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Main Open Portal Frame Structure -->
        <path d="M100,420 L100,200 L400,100 L700,200 L700,420" fill="none" stroke="url(#svc12-steel)" stroke-width="16" stroke-linejoin="round"/>
        <!-- Central Raised Ventilation Monitor (Ridge Vent) -->
        <polygon points="320,126 400,75 480,126" fill="none" stroke="url(#svc12-orange)" stroke-width="6"/>
        <line x1="320" y1="126" x2="480" y2="126" stroke="url(#svc12-orange)" stroke-width="4"/>
        <!-- Internal Clear-Span Truss Tie Beams -->
        <line x1="100" y1="200" x2="700" y2="200" stroke="url(#svc12-steel)" stroke-width="8"/>
        <line x1="250" y1="200" x2="350" y2="117" stroke="#94a3b8" stroke-width="4"/>
        <line x1="550" y1="200" x2="450" y2="117" stroke="#94a3b8" stroke-width="4"/>
        <!-- Lower Livestock Feeding Trough & Pipe Separation Railing -->
        <rect x="120" y="330" width="560" height="80" fill="#0c1f44" stroke="#64748b" stroke-width="3"/>
        <line x1="120" y1="365" x2="680" y2="365" stroke="#f5a623" stroke-width="4"/>
        <!-- Concrete Base Pier Pedestals (Ammonia Corrosion Protection) -->
        <rect x="85" y="390" width="30" height="35" rx="2" fill="#94a3b8"/>
        <rect x="685" y="390" width="30" height="35" rx="2" fill="#94a3b8"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Ventilated Cattle Dairy Sheds (Tabela), Poultry Coops &amp;amp; Livestock Shelters</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>