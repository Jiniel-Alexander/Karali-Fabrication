<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Architectural Steel Pergolas, Terrace Louver Canopies &amp;amp; Gazebo Roofs">
  <defs>
    <linearGradient id="svc9-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc9-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc9-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc9-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc9-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc9-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc9-bg)"/>
  <rect width="800" height="500" fill="url(#svc9-grid)"/>
  <rect width="800" height="500" fill="url(#svc9-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">09 / ARCHITECTURAL LIVING METALWORK</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-09 // PERGOLAS &amp;amp; GAZEBOS</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Upright Hollow Square Steel Posts -->
        <rect x="140" y="140" width="30" height="280" fill="url(#svc9-steel-dark)" stroke="url(#svc9-steel)" stroke-width="2"/>
        <rect x="630" y="140" width="30" height="280" fill="url(#svc9-steel-dark)" stroke="url(#svc9-steel)" stroke-width="2"/>
        <rect x="260" y="160" width="24" height="260" fill="url(#svc9-steel-dark)" stroke="#64748b" stroke-width="1.5"/>
        <rect x="510" y="160" width="24" height="260" fill="url(#svc9-steel-dark)" stroke="#64748b" stroke-width="1.5"/>
        <!-- Main Overhead Perimeter Beams -->
        <rect x="110" y="125" width="580" height="28" fill="url(#svc9-orange)" stroke="#0f1f4a" stroke-width="2"/>
        <!-- Cantilevered Pergola Louvers / Rafters -->
        <g fill="url(#svc9-steel)">
          <rect x="150" y="98" width="14" height="35" rx="2"/>
          <rect x="210" y="98" width="14" height="35" rx="2"/>
          <rect x="270" y="98" width="14" height="35" rx="2"/>
          <rect x="330" y="98" width="14" height="35" rx="2"/>
          <rect x="390" y="98" width="14" height="35" rx="2"/>
          <rect x="450" y="98" width="14" height="35" rx="2"/>
          <rect x="510" y="98" width="14" height="35" rx="2"/>
          <rect x="570" y="98" width="14" height="35" rx="2"/>
          <rect x="630" y="98" width="14" height="35" rx="2"/>
        </g>
        <!-- Tempered Glass / Polycarbonate Roof Sheet Overlay -->
        <line x1="120" y1="96" x2="680" y2="96" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.8"/>
        <!-- Architectural Base Plates -->
        <rect x="130" y="412" width="50" height="14" fill="#f5a623"/>
        <rect x="620" y="412" width="50" height="14" fill="#f5a623"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Architectural Steel Pergolas, Terrace Louver Canopies &amp;amp; Gazebo Roofs</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>