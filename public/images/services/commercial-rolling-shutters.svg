<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Motorized &amp;amp; Gear-Operated Industrial Steel Rolling Shutters &amp;amp; Bay Doors">
  <defs>
    <linearGradient id="svc10-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc10-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc10-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc10-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc10-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc10-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc10-bg)"/>
  <rect width="800" height="500" fill="url(#svc10-grid)"/>
  <rect width="800" height="500" fill="url(#svc10-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">10 / COMMERCIAL ACCESS &amp;amp; SECURITY</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-10 // ROLLING SHUTTERS</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Outer Masonry/Portal Surround -->
        <rect x="160" y="70" width="480" height="350" fill="none" stroke="#334155" stroke-width="12"/>
        <!-- Top Overhead Motor/Spring Barrel Hood -->
        <rect x="180" y="80" width="440" height="60" rx="8" fill="url(#svc10-steel-dark)" stroke="url(#svc10-orange)" stroke-width="3"/>
        <circle cx="210" cy="110" r="14" fill="#f5a623"/>
        <circle cx="590" cy="110" r="14" fill="#f5a623"/>
        <!-- Interlocking Cold-Rolled Shutter Slats Curtain -->
        <rect x="200" y="140" width="400" height="250" fill="#0a193d" stroke="url(#svc10-steel)" stroke-width="3"/>
        <g stroke="#cbd5e1" stroke-width="3">
          <line x1="200" y1="165" x2="600" y2="165"/><line x1="200" y1="190" x2="600" y2="190"/>
          <line x1="200" y1="215" x2="600" y2="215"/><line x1="200" y1="240" x2="600" y2="240"/>
          <line x1="200" y1="265" x2="600" y2="265"/><line x1="200" y1="290" x2="600" y2="290"/>
          <line x1="200" y1="315" x2="600" y2="315"/><line x1="200" y1="340" x2="600" y2="340"/>
          <line x1="200" y1="365" x2="600" y2="365"/>
        </g>
        <!-- Heavy Bottom Locking Rail & Center Lock -->
        <rect x="195" y="380" width="410" height="24" fill="url(#svc10-orange)"/>
        <rect x="385" y="385" width="30" height="14" fill="#07122b"/>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Motorized &amp;amp; Gear-Operated Industrial Steel Rolling Shutters &amp;amp; Bay Doors</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>