<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Drilled MS Base Plates, Stiffened Gusset Brackets &amp; Equipment Skids">
  <defs>
    <linearGradient id="svc5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="svc5-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="svc5-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="svc5-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="svc5-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="svc5-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#svc5-bg)"/>
  <rect width="800" height="500" fill="url(#svc5-grid)"/>
  <rect width="800" height="500" fill="url(#svc5-glow)"/>

  <!-- Top Technical Header Bar -->
  <rect x="28" y="24" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.78" stroke="#335599" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#f5a623"/>
  <text x="66" y="48" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1.5">05 / BESPOKE METALWORK &amp; SITE WELDING</text>
  <text x="752" y="48" fill="#f5a623" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">KF-SVC-05 // CUSTOM METALWORK</text>

  <!-- Main Structural Scene -->
  
      <g>
        <!-- Heavy Drilled MS Base Plate Assembly (Left) -->
        <rect x="95" y="135" width="240" height="230" rx="8" fill="url(#svc5-steel-dark)" stroke="url(#svc5-steel)" stroke-width="5"/>
        <circle cx="130" cy="170" r="13" fill="#07122b" stroke="#f5a623" stroke-width="3"/>
        <circle cx="300" cy="170" r="13" fill="#07122b" stroke="#f5a623" stroke-width="3"/>
        <circle cx="130" cy="330" r="13" fill="#07122b" stroke="#f5a623" stroke-width="3"/>
        <circle cx="300" cy="330" r="13" fill="#07122b" stroke="#f5a623" stroke-width="3"/>
        <!-- Welded Center H-Section & Stiffener Gussets -->
        <rect x="165" y="232" width="100" height="36" fill="url(#svc5-orange)"/>
        <rect x="197" y="185" width="36" height="130" fill="url(#svc5-steel)"/>

        <!-- Welded Equipment Skid & Trench Grating (Right) -->
        <rect x="395" y="145" width="310" height="110" rx="4" fill="#0d1e46" stroke="url(#svc5-steel)" stroke-width="6"/>
        <line x1="470" y1="145" x2="470" y2="255" stroke="url(#svc5-steel)" stroke-width="6"/>
        <line x1="550" y1="145" x2="550" y2="255" stroke="url(#svc5-steel)" stroke-width="6"/>
        <line x1="630" y1="145" x2="630" y2="255" stroke="url(#svc5-steel)" stroke-width="6"/>
        <rect x="415" y="133" width="35" height="12" fill="#f5a623"/>
        <rect x="650" y="133" width="35" height="12" fill="#f5a623"/>

        <!-- Drain / Trench Grating Panel -->
        <rect x="395" y="290" width="310" height="85" rx="4" fill="#0d1e46" stroke="#f5a623" stroke-width="4"/>
        <g stroke="#94a3b8" stroke-width="3">
          <line x1="425" y1="290" x2="425" y2="375"/>
          <line x1="455" y1="290" x2="455" y2="375"/>
          <line x1="485" y1="290" x2="485" y2="375"/>
          <line x1="515" y1="290" x2="515" y2="375"/>
          <line x1="545" y1="290" x2="545" y2="375"/>
          <line x1="575" y1="290" x2="575" y2="375"/>
          <line x1="605" y1="290" x2="605" y2="375"/>
          <line x1="635" y1="290" x2="635" y2="375"/>
          <line x1="665" y1="290" x2="665" y2="375"/>
          <line x1="395" y1="332" x2="705" y2="332" stroke="#f5a623" stroke-width="2.5"/>
        </g>
      </g>

  <!-- Base Horizon & Caption Bar -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#f5a623" stroke-width="2.5"/>
  <rect x="28" y="438" width="744" height="38" rx="6" fill="#08132c" fill-opacity="0.82"/>
  <text x="46" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.8">Drilled MS Base Plates, Stiffened Gusset Brackets &amp; Equipment Skids</text>
  <text x="754" y="462" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">PER CLIENT DRAWING / BOQ</text>
</svg>