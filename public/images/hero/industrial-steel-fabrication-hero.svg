<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Industrial structural steel fabrication and erection visual">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07122b"/>
      <stop offset="55%" stop-color="#102454"/>
      <stop offset="100%" stop-color="#1d3b82"/>
    </linearGradient>
    <linearGradient id="hero-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hero-steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hero-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf70"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="68%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07122b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#4267b2" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#hero-bg)"/>
  <rect width="1280" height="800" fill="url(#hero-grid)"/>
  <rect width="1280" height="800" fill="url(#hero-glow)"/>

  <!-- Perspective Industrial Portal Frame Bays -->
  <g stroke="#3b62b5" stroke-width="1.5" opacity="0.5" fill="none">
    <polygon points="100,670 100,200 640,65 1180,200 1180,670"/>
    <polygon points="230,670 230,255 640,140 1050,255 1050,670"/>
    <polygon points="355,670 355,305 640,210 925,305 925,670"/>
    <line x1="100" y1="200" x2="355" y2="305"/>
    <line x1="1180" y1="200" x2="925" y2="305"/>
    <line x1="640" y1="65" x2="640" y2="210"/>
  </g>

  <!-- Heavy Steel H-Columns & Overhead Truss Girders -->
  <g>
    <rect x="125" y="175" width="54" height="495" fill="url(#hero-steel-dark)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="142" y="175" width="20" height="495" fill="url(#hero-steel)"/>

    <rect x="1100" y="175" width="54" height="495" fill="url(#hero-steel-dark)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1117" y="175" width="20" height="495" fill="url(#hero-steel)"/>

    <rect x="530" y="215" width="46" height="455" fill="url(#hero-steel-dark)" stroke="#94a3b8" stroke-width="1.8"/>
    <rect x="545" y="215" width="16" height="455" fill="url(#hero-steel)"/>

    <!-- Primary Horizontal Girder -->
    <rect x="110" y="345" width="1060" height="44" fill="url(#hero-steel-dark)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="110" y="357" width="1060" height="20" fill="url(#hero-steel)"/>

    <!-- Warren Roof Truss Chord -->
    <rect x="110" y="160" width="1060" height="22" fill="url(#hero-steel)"/>
    <rect x="110" y="232" width="1060" height="18" fill="url(#hero-steel-dark)" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M140,232 L220,182 L300,232 L380,182 L460,232 L540,182 L620,232 L700,182 L780,232 L860,182 L940,232 L1020,182 L1100,232" fill="none" stroke="url(#hero-orange)" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Bolted Gusset Plates & Base Plates -->
  <g fill="#f5a623" stroke="#0f1f4a" stroke-width="2">
    <polygon points="179,345 245,345 179,410"/>
    <polygon points="576,345 642,345 576,410"/>
    <polygon points="1100,345 1034,345 1100,410"/>
    <rect x="108" y="655" width="88" height="18" rx="3"/>
    <rect x="509" y="655" width="88" height="18" rx="3"/>
    <rect x="1083" y="655" width="88" height="18" rx="3"/>
  </g>

  <!-- Arc Welding Highlight & Sparks -->
  <g>
    <circle cx="860" cy="345" r="95" fill="url(#hero-glow)"/>
    <circle cx="860" cy="345" r="13" fill="#ffffff"/>
    <circle cx="860" cy="345" r="30" fill="#f5a623" fill-opacity="0.45"/>
    <g stroke="#ffcf70" stroke-width="2.5" stroke-linecap="round">
      <line x1="860" y1="345" x2="928" y2="288"/>
      <line x1="860" y1="345" x2="942" y2="360"/>
      <line x1="860" y1="345" x2="905" y2="418"/>
      <line x1="860" y1="345" x2="798" y2="292"/>
      <line x1="860" y1="345" x2="785" y2="398"/>
      <circle cx="948" cy="276" r="3" fill="#ffcf70"/>
      <circle cx="964" cy="366" r="2.5" fill="#ffcf70"/>
      <circle cx="920" cy="432" r="3" fill="#ffcf70"/>
    </g>
  </g>

  <line x1="60" y1="673" x2="1220" y2="673" stroke="#f5a623" stroke-width="3"/>
  <g fill="#cbd5e1" font-family="monospace" font-size="15" letter-spacing="2">
    <text x="85" y="725">KARALI FABRICATION // STRUCTURAL STEEL &amp; CUSTOM METALWORK</text>
    <text x="915" y="725" fill="#f5a623">MUMBAI · THANE · NAVI MUMBAI</text>
  </g>
</svg>